services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schrt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schrt_pass}
      POSTGRES_DB: ${POSTGRES_DB:-schrt}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schrt} -d ${POSTGRES_DB:-schrt}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: amazon/aws-cli:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://minio:9000 --region us-east-1 s3 mb s3://${MINIO_BUCKET:-submissions} || true;
      exit 0;
      "

  backend:
    build: ./backend
    command: /app/entrypoint.sh
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-schrt}:${POSTGRES_PASSWORD:-schrt_pass}@postgres/${POSTGRES_DB:-schrt}
      SECRET_KEY: ${SECRET_KEY:-super-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-submissions}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      LINK_PREFIX: ${LINK_PREFIX:-http://localhost:5174/s/}
      FIRST_TEACHER_USERNAME: ${FIRST_TEACHER_USERNAME:-teacher}
      FIRST_TEACHER_PASSWORD: ${FIRST_TEACHER_PASSWORD:-teacher}
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8001/api}
      VITE_LINK_PREFIX: ${LINK_PREFIX:-http://localhost:5174/s/}
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
